apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdack
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: pdack
    creationPolicy: Orphan
  dataFrom:
    - find:
        name:
          regexp: .*
        path: /pdack
