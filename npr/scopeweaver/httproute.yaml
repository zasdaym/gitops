apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scopeweaver
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http
      namespace: nginx-gateway
  hostnames:
    - scopeweaver.zasda.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: scopeweaver
          port: 80
