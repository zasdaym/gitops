apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scopeweaver
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: scopeweaver
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        ARTEX_PG_DSN: postgres://postgres:{{ .pgpassword }}@postgres.postgres.svc:5432/scopeweaver?sslmode=disable
  data:
    - secretKey: pgpassword
      remoteRef:
        key: /postgres/POSTGRES_PASSWORD
  dataFrom:
    - find:
        name:
          regexp: .*
        path: /scopeweaver
