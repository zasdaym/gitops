vmauth:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

vminsert:
  replicaCount: 1
  service:
    clusterIP: None
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

vmselect:
  replicaCount: 1
  service:
    clusterIP: None
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

vmstorage:
  replicaCount: 1
  retentionPeriod: 31d
  persistentVolume:
    enabled: true
    storageClassName: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
