namespace: grafana
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app: grafana
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
configMapGenerator:
- name: grafana-datasources
  files:
  - datasources.yaml
- name: grafana-dashboard-provider
  files:
  - dashboard-provider.yaml
- name: grafana-dashboard-node-exporter
  files:
  - node-exporter.json=dashboards/node-exporter.json
- name: grafana-dashboard-victoriametrics-cluster
  files:
  - victoriametrics-cluster.json=dashboards/victoriametrics-cluster.json
- name: grafana-dashboard-victorialogs-cluster
  files:
  - victorialogs-cluster.json=dashboards/victorialogs-cluster.json
patches:
- target:
    kind: ConfigMap
    name: grafana-dashboard-victoriametrics-cluster
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-dashboard-victoriametrics-cluster
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
- target:
    kind: ConfigMap
    name: grafana-dashboard-victorialogs-cluster
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-dashboard-victorialogs-cluster
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
