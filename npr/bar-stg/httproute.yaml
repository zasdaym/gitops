apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bar-stg
spec:
  parentRefs:
    - name: http
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - bar-stg.zasda.id
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bar-stg
          port: 80
